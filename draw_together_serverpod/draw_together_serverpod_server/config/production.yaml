# This is the configuration file for your production environment.
# Typically, you will want to route the traffic through a load balancer
# which adds SSL security through https. If you use Serverpod's standard
# Terraform scripts to deploy your server, all you need to change in
# this file is the examplepod.com domain name.

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: draw-together-ap91.onrender.com
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server.
insightsServer:
  port: 8081
  publicHost: draw-together-ap91.onrender.com
  publicPort: 443
  publicScheme: https

# Configuration for the web server.
webServer:
  port: 8082
  publicHost: draw-together-ap91.onrender.com
  publicPort: 443
  publicScheme: https

# This is the database setup for your servers. The default for the Google Cloud
# Engine Terraform configuration is to connect on a private IP address.
# If you are connecting on a public IP (e.g. on AWS or Google Cloud Run), you
# connect on the public IP of the database e.g. database.examplepod.com.
#
# These $NAME strings are NOT expanded — Serverpod does no substitution on this
# file, so anything left unset here arrives at Postgres literally. The real
# values come from the SERVERPOD_DATABASE_* environment variables, which take
# precedence over every key below; on Render they are set on the service from the
# managed Postgres instance. The placeholders only record which keys must be
# supplied that way.
#
# `password` is the exception: DatabaseConfig reads it from the passwords map
# (SERVERPOD_DATABASE_PASSWORD, or config/passwords.yaml) and never from this
# file, so the key below is inert either way. Same for redis.password.
database:
  host: $DATABASE_HOST
  port: 5432
  name: $DATABASE_NAME
  user: $DATABASE_USER
  requireSsl: true
  password: $DATABASE_PASSWORD
  #isUnixSocket: true # defaults to false
  #maxConnectionCount: 10 # Defaults to 10, a negative or null value removes the limit

# This is the setup for Redis. The default for the Google Cloud Engine Terraform
# configuration is to connect on a private IP address.
# If you are connecting on a public IP (e.g. on AWS or Google Cloud Run), you
# connect on the public IP of the database e.g. redis.examplepod.com.
redis:
  enabled: false
  host: redis.private-production.examplepod.com
  port: 6379
  password: $REDIS_PASSWORD
  #user: # defaults to empty
  #requireSsl: true # defaults to false

# Target image uploads are capped at maxTargetImageBytes (5 MiB) by
# RoomEndpoint.uploadTargetImage, and Serverpod base64-encodes the ByteData on
# the wire, so an upload at that cap arrives as roughly 6.7 MiB of request body.
# The default 512 KiB would reject it at the transport layer, before the endpoint
# ever got to apply its own limit.
maxRequestSize: 10485760 # 10 MiB

sessionLogs:
  # Render collects a service's stdout as its log stream, so console logging is
  # the only way to see anything from a deployed instance.
  consoleEnabled: true
# persistentEnabled: true
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000
